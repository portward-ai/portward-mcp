<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Portward password</title>
<style>
/*PORTWARD_STYLES*/
  /* The database password form: where the password goes, one hidden field, one button. */
  .head { display: grid; gap: 2px; margin-bottom: 12px; }
  .where { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; margin: 0 0 12px; }
  .where dt { color: var(--muted); font-size: var(--text-caption); align-self: baseline; }
  .where dd { margin: 0; overflow-wrap: anywhere; }
  .form { display: grid; gap: 8px; max-width: 28rem; }
  .form label { font-weight: 500; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .saved { display: grid; gap: 8px; }
</style>
</head>
<body>
<main>
<header class="head">
  <h1 id="title">Portward</h1>
  <p class="status" id="status" role="status"></p>
</header>
<div id="body"></div>
</main>
<script>/*PORTWARD_HOST*/</script>
<script>
"use strict";
// What the user types goes from this field to the local server through the host (the app-only save_secret tool),
// with the single-use ask from the result's _meta (or, in hosts that drop _meta, read with the app-only secret_request
// tool and the result's public request_id): a database password (tested, then saved in the keychain) or the
// sharing code; or, for a file, one Allow button and nothing typed. The AI never sees the field, the tool or its result. The one thing this page can put in the chat is
// the ask's fixed sentence saying it was saved.
const { el } = PortwardUI;
const bodyEl = document.getElementById("body");
const statusEl = document.getElementById("status");
const titleEl = document.getElementById("title");
const REQUEST = "portward/secret_request";
const ALLOW = "allow";  // asks.ALLOW: what an allow ask's button sends
const host = () => PortwardHost.hostName();

function setStatus(text, tone) { statusEl.textContent = text; statusEl.dataset.tone = tone || ""; }

function where(details) {
  return el("dl", { class: "where" }, ...details.flatMap(([label, value]) => [el("dt", {}, label), el("dd", { class: "id" }, value)]));
}

function saved(ask, result) {
  const data = result.structuredContent || {};
  const tables = data.tables || [];
  const warnings = data.warnings || [];
  // Only a database password goes in the keychain; an allowed file is just added (#115).
  const done = typeof data.added === "string" && data.added ? `Allowed. ${host()} can read ${data.added} now.`
    : data.saved ? "Saved in this computer's keychain. The connection works." : "Saved.";
  setStatus(done, "ok");
  const tell = el("button", { class: "primary", type: "button", onclick: async () => {
    tell.disabled = true;
    try {
      const outcome = await PortwardHost.putInChat(ask.done);
      note.textContent = outcome === "composed" ? "It's in the message box: press send." : "Sent.";
    } catch (err) { tell.disabled = false; note.textContent = err.message; }
  } }, `Tell ${host()}`);
  const note = el("p", { class: "caption", role: "status" });
  bodyEl.replaceChildren(el("div", { class: "saved" },
    data.saved || data.added ? el("p", {}, tables.length ? `Tables: ${tables.join(", ")}.` : "No tables are visible to this login.") : null,
    ...warnings.map((w) => el("div", { class: "notice" }, el("h2", {}, "This login can change data"), el("p", {}, PortwardUI.sentence(w)))),
    PortwardHost.canPutInChat() ? el("div", { class: "row" }, tell, note)
      : el("p", { class: "caption" }, `Tell ${host()} in the chat that it's done.`)));
}

// Letting the AI read a file: the file's name and one button, nothing to type (#115). The ask's token reaches only
// this panel, never the AI, so the button is the user's own yes.
function allowForm(ask) {
  const allow = async () => {
    button.disabled = true;
    setStatus("Checking…");
    try {
      saved(ask, await PortwardHost.callTool("save_secret", { request: ask.token, secret: ALLOW }));
    } catch (err) {
      button.disabled = false;
      setStatus(PortwardUI.sentence(err.message), "err");
    }
  };
  const button = el("button", { class: "primary", type: "button", onclick: allow }, ask.label);
  titleEl.textContent = ask.title;
  bodyEl.replaceChildren(where(ask.details || []), el("div", { class: "form", role: "group", "aria-labelledby": "title" },
    el("p", { class: "caption" }, "Your block rules still apply."), el("div", { class: "row" }, button)));
  button.focus();
}

function form(ask) {
  if (ask.allow === true) { allowForm(ask); return; }
  // Not a form element: hosts frame the panel sandboxed without allow-forms, which blocks submitting one, so the button
  // and Enter in the field save it instead.
  const save = async () => {
    const secret = input.value;
    if (!secret) { setStatus(`Type the ${ask.label.toLowerCase()} first.`, "err"); input.focus(); return; }
    button.disabled = true;
    setStatus("Checking…");
    try {
      const result = await PortwardHost.callTool("save_secret", { request: ask.token, secret });
      input.value = "";
      saved(ask, result);
    } catch (err) {
      input.value = "";
      button.disabled = false;
      setStatus(PortwardUI.sentence(err.message), "err");
      input.focus();
    }
  };
  const input = el("input", { type: ask.hidden === false ? "text" : "password", id: "pw", name: "secret", autocomplete: "off", spellcheck: "false",
                              required: true, "aria-describedby": "pw-note",
                              onkeydown: (event) => { if (event.key === "Enter" && !button.disabled) { event.preventDefault(); save(); } } });
  const button = el("button", { class: "primary", type: "button", onclick: save }, "Save");
  const node = el("div", { class: "form", role: "group", "aria-labelledby": "title" },
    el("label", { for: "pw" }, ask.label), input,
    el("p", { class: "caption", id: "pw-note" }, `It goes to Portward on this computer only. ${host()} never sees it.`),
    el("div", { class: "row" }, button));
  titleEl.textContent = ask.title;
  bodyEl.replaceChildren(where(ask.details || []), node);
  input.focus();
}

const isAsk = (ask) => Boolean(ask && typeof ask.token === "string" && typeof ask.label === "string");

// The form's ask: from the result's _meta when the host passes it, else (Claude Desktop doesn't) read with the
// app-only secret_request tool and the result's public request_id. Null when the result asked for nothing here.
async function askFor(result, data) {
  const meta = result && result._meta && result._meta[REQUEST];
  if (isAsk(meta)) return meta;
  if (typeof data.request_id !== "string" || !data.request_id) return null;
  setStatus("Opening the form…");
  const read = await PortwardHost.callTool("secret_request", { request_id: data.request_id });
  setStatus("");
  if (!isAsk(read && read.structuredContent)) throw new Error("Portward sent a form this panel can't read");
  return read.structuredContent;
}

async function handleResult(result) {
  const failed = PortwardUI.failure(result);
  if (failed) { bodyEl.replaceChildren(PortwardUI.problem("That didn't work", failed, "Ask again in the chat.")); return; }
  const data = (result && result.structuredContent) || {};
  let ask;
  try { ask = await askFor(result, data); } catch (err) {
    setStatus("");
    bodyEl.replaceChildren(PortwardUI.problem("The form isn't available", err.message, "Ask again in the chat."));
    return;
  }
  if (ask) { form(ask); return; }
  if (typeof data.added === "string" && data.added) {  // only a source really added says connected
    titleEl.textContent = "Source connected";
    const tables = data.tables || [];
    bodyEl.replaceChildren(PortwardUI.empty(`${data.added} is connected${tables.length ? ": " + tables.join(", ") : ""}.`));
    return;
  }
  const asked = Object.keys(data).some((k) => k.endsWith("_entry") && data[k] === "panel");
  bodyEl.replaceChildren(asked
    ? PortwardUI.problem("The form isn't available", "Portward couldn't show the form here", "Ask again in the chat.")
    : PortwardUI.empty("There's nothing to type here.", `${host()} has the answer in the chat.`));
}

PortwardHost.start(handleResult);
</script>
</body>
</html>
