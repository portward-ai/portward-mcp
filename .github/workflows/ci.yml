# Pull requests and pushes to main: the test suite on Linux, with the two test databases. The Desktop extension's
# builds (macOS, Windows) run for a release or by hand: see extension.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Start the test databases (the integration tests skip when they are down)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=pw -p 127.0.0.1:15432:5432 postgres:16-alpine
          docker run -d --name mysql -e MYSQL_ROOT_PASSWORD=pw -p 127.0.0.1:13306:3306 mysql:8
      - name: Tests
        run: uv run --frozen pytest -q -p no:cacheprovider
